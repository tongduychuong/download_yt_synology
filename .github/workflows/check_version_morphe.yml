name: Check Morphe Max Supported YouTube Version (Dev)

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cần quyền ghi để push commit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract and Compare Version (Dev)
        shell: python
        run: |
            import urllib.request
            import re
            import os

            def get_max_yt_version(branch_name):
                url = f'https://raw.githubusercontent.com/MorpheApp/morphe-patches/{branch_name}/README.md'
                try:
                    req = urllib.request.urlopen(url)
                    readme_text = req.read().decode('utf-8')
                except Exception:
                    return None
                
                yt_block_match = re.search(r'(?i)(?:###?\s*YouTube|com\.google\.android\.youtube)(.*?)(?:\n#+|\Z)', readme_text, re.DOTALL)
                content = yt_block_match.group(1) if yt_block_match else readme_text
                versions = set(re.findall(r'\b\d{2,3}\.\d{1,2}\.\d{1,3}\b|\b\d{1}\.\d{2}\.\d{1,3}\b', content))
                valid = [v for v in versions if not v.startswith(('2024', '2025', '2026'))]
                return sorted(valid, key=lambda v: [int(x) for x in re.findall(r'\d+', v)])[-1] if valid else None

            filename = 'version.txt'
            branch = 'dev'
            new_ver = get_max_yt_version(branch)
            old_ver = ''
            
            if os.path.exists(filename):
                with open(filename, 'r') as f:
                    old_ver = f.read().strip()
            
            changed = "false"
            if new_ver and new_ver != old_ver:
                with open(filename, 'w') as f:
                    f.write(new_ver)
                changed = "true"
                print(f"Updated {filename} to {new_ver}")

            # Ghi biến trực tiếp vào GitHub Environment
            github_env = os.getenv('GITHUB_ENV')
            if github_env:
                with open(github_env, 'a') as env_file:
                    env_file.write(f"VERSION_CHANGED={changed}\n")
                    env_file.write(f"NEW_VER={new_ver or old_ver}\n")

      - name: Commit and Push if updated
        run: |
          if [ "${{ env.VERSION_CHANGED }}" = "true" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add version.txt
            git commit -m "build: update YouTube version from dev branch (${{ env.NEW_VER }})"
            git push
            echo "Đã cập nhật phiên bản mới vào version.txt."
          else
            echo "Không có phiên bản mới, không thực hiện commit."
          fi
