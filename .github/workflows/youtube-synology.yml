name: Download YouTube APK

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. READ VERSION
      # ==================================================

      - name: Read version.txt
        shell: bash
        run: |
          set -e

          if [ ! -f "version.txt" ]; then
            echo "ERROR: Không tìm thấy version.txt"
            exit 1
          fi

          VERSION="$(cat version.txt | tr -d '\r\n' | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt rỗng"
            exit 1
          fi

          echo "VERSION=$VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"


      # ==================================================
      # 3. NODE
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==================================================
      # 4. INSTALL
      # ==================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          npm install

          npx playwright install chromium

          npx playwright install-deps chromium


      # ==================================================
      # 5. DOWNLOAD APK
      # ==================================================

      - name: Download YouTube APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          echo "======================================"
          echo "Downloading YouTube APK"
          echo "VERSION: $VERSION"
          echo "======================================"

          node scripts/apkmirror.js

          APK="com.google.android.youtube-${VERSION}-all.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK không tồn tại:"
            echo "$APK"
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"


      # ==================================================
      # 6. CHECK APK
      # ==================================================

      - name: Verify APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          echo "Checking APK..."

          file "$APK"

          SIZE=$(stat -c%s "$APK")

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 10485760 ]; then
            echo "ERROR: APK quá nhỏ"
            exit 1
          fi

          echo "APK OK"


      # ==================================================
      # 7. SETUP SSH
      # ==================================================

      - name: Setup Synology SSH
        shell: bash
        env:
          SYNOLOGY_HOST: ${{ secrets.SYNOLOGY_HOST }}
          SYNOLOGY_SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SYNOLOGY_SSH_KEY: ${{ secrets.SYNOLOGY_SSH_KEY }}
        run: |
          set -e

          echo "======================================"
          echo "Setup Synology SSH"
          echo "======================================"

          if [ -z "$SYNOLOGY_HOST" ]; then
            echo "ERROR: SYNOLOGY_HOST chưa được cấu hình"
            exit 1
          fi

          if [ -z "$SYNOLOGY_SSH_PORT" ]; then
            echo "ERROR: SYNOLOGY_SSH_PORT chưa được cấu hình"
            exit 1
          fi

          if [ -z "$SYNOLOGY_SSH_KEY" ]; then
            echo "ERROR: SYNOLOGY_SSH_KEY chưa được cấu hình"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"

          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SYNOLOGY_SSH_KEY" \
            > "$HOME/.ssh/synology_key"

          chmod 600 "$HOME/.ssh/synology_key"

          touch "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "Host: $SYNOLOGY_HOST"
          echo "Port: $SYNOLOGY_SSH_PORT"

          echo "Getting SSH host key..."

          ssh-keyscan \
            -T 15 \
            -p "$SYNOLOGY_SSH_PORT" \
            "$SYNOLOGY_HOST" \
            >> "$HOME/.ssh/known_hosts"

          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "ERROR: ssh-keyscan không lấy được host key"
            exit 1
          fi

          echo "SSH host key added."


      # ==================================================
      # 8. TEST SSH
      # ==================================================

      - name: Test Synology SSH
        shell: bash
        env:
          SYNOLOGY_HOST: ${{ secrets.SYNOLOGY_HOST }}
          SYNOLOGY_SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
        run: |
          set -e

          if [ -z "$SYNOLOGY_USER" ]; then
            echo "ERROR: SYNOLOGY_USER chưa được cấu hình"
            exit 1
          fi

          echo "Testing SSH..."

          ssh \
            -i "$HOME/.ssh/synology_key" \
            -p "$SYNOLOGY_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$SYNOLOGY_USER@$SYNOLOGY_HOST" \
            "echo SSH_OK"

          echo "SSH connection OK"


      # ==================================================
      # 9. CREATE SYNLOGY DIRECTORY
      # ==================================================

      - name: Prepare Synology directory
        shell: bash
        env:
          SYNOLOGY_HOST: ${{ secrets.SYNOLOGY_HOST }}
          SYNOLOGY_SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}
        run: |
          set -e

          if [ -z "$SYNOLOGY_PATH" ]; then
            echo "ERROR: SYNOLOGY_PATH chưa được cấu hình"
            exit 1
          fi

          echo "Synology path:"
          echo "$SYNOLOGY_PATH"

          ssh \
            -i "$HOME/.ssh/synology_key" \
            -p "$SYNOLOGY_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$SYNOLOGY_USER@$SYNOLOGY_HOST" \
            "mkdir -p '$SYNOLOGY_PATH'"

          echo "Directory ready."


      # ==================================================
      # 10. UPLOAD APK
      # ==================================================

      - name: Upload APK to Synology
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
          SYNOLOGY_HOST: ${{ secrets.SYNOLOGY_HOST }}
          SYNOLOGY_SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Không tìm thấy:"
            echo "$APK"
            exit 1
          fi

          echo "======================================"
          echo "Uploading APK"
          echo "FILE:"
          echo "$APK"
          echo "DESTINATION:"
          echo "$SYNOLOGY_PATH"
          echo "======================================"

          scp \
            -O \
            -i "$HOME/.ssh/synology_key" \
            -P "$SYNOLOGY_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$APK" \
            "$SYNOLOGY_USER@$SYNOLOGY_HOST:$SYNOLOGY_PATH/"

          echo "Upload completed."


      # ==================================================
      # 11. VERIFY FILE ON SYNOLOGY
      # ==================================================

      - name: Verify Synology file
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
          SYNOLOGY_HOST: ${{ secrets.SYNOLOGY_HOST }}
          SYNOLOGY_SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          echo "Checking remote file..."

          ssh \
            -i "$HOME/.ssh/synology_key" \
            -p "$SYNOLOGY_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "$SYNOLOGY_USER@$SYNOLOGY_HOST" \
            "ls -lh '$SYNOLOGY_PATH/$APK'"

          echo "======================================"
          echo "SUCCESS"
          echo "APK đã upload lên Synology."
          echo "======================================"


      # ==================================================
      # 12. CLEAN SSH
      # ==================================================

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/synology_key"
