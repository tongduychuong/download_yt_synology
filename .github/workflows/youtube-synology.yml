      # ================================================
      # SHOW RELEASE
      # ================================================

      - name: Show Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        shell: bash
        run: |

          set -e

          TAG="youtube-${VERSION}"

          gh release view "$TAG"


      # ================================================
      # CLEANUP OLD RELEASES + TAGS + WORKFLOWS
      # ================================================

      - name: Cleanup old releases and workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |

          set -e

          echo "================================"
          echo "KEEP 2 NEWEST RELEASES"
          echo "================================"

          # Lấy release theo thời gian tạo, mới nhất trước
          RELEASES=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].id')

          COUNT=0

          for RELEASE_ID in $RELEASES; do

            COUNT=$((COUNT + 1))

            if [ "$COUNT" -le 2 ]; then

              echo "KEEP RELEASE ID: $RELEASE_ID"

            else

              TAG=$(gh api \
                "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                --jq '.tag_name')

              echo "DELETE RELEASE: $RELEASE_ID"
              echo "DELETE TAG: $TAG"

              # Xóa release
              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"

              # Xóa tag
              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
                || true

            fi

          done


          echo ""
          echo "================================"
          echo "KEEP 3 NEWEST WORKFLOW RUNS"
          echo "================================"

          # Lấy tất cả workflow runs
          RUNS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id')

          COUNT=0

          for RUN_ID in $RUNS; do

            COUNT=$((COUNT + 1))

            if [ "$COUNT" -le 3 ]; then

              echo "KEEP WORKFLOW RUN: $RUN_ID"

            else

              echo "DELETE WORKFLOW RUN: $RUN_ID"

              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                || true

            fi

          done


          echo ""
          echo "================================"
          echo "CLEANUP COMPLETED"
          echo "================================"
