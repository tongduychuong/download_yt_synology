name: YouTube APKMirror to Synology

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip openssh-client
          python3 -m pip install --upgrade --break-system-packages requests beautifulsoup4 lxml

      - name: Find latest YouTube version
        id: version
        run: python3 scripts/find_youtube.py

      - name: Download YouTube APK
        env:
          RELEASE_URL: ${{ steps.version.outputs.release_url }}
        run: python3 scripts/download_youtube.py

      - name: Generate SHA256
        run: |
          VERSION="$(cat version.txt)"
          sha256sum "YouTube-${VERSION}.apk" | tee sha256.txt

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SYNOLOGY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/synology_key
          chmod 600 ~/.ssh/synology_key
          ssh-keyscan -p "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" "${{ secrets.SYNOLOGY_HOST }}" >> ~/.ssh/known_hosts

      - name: Test Synology SSH
        run: |
          ssh -i ~/.ssh/synology_key -p "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}" "echo SSH connection OK"

      - name: Create Synology directory
        run: |
          ssh -i ~/.ssh/synology_key -p "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}" "mkdir -p '${{ secrets.SYNOLOGY_PATH }}'"

      - name: Check existing APK
        id: check
        run: |
          VERSION="$(cat version.txt)"
          if ssh -i ~/.ssh/synology_key -p "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}" "test -f '${{ secrets.SYNOLOGY_PATH }}/YouTube-${VERSION}.apk'"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "YouTube ${VERSION} already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK to Synology
        if: steps.check.outputs.exists != 'true'
        run: |
          VERSION="$(cat version.txt)"
          scp -O -i ~/.ssh/synology_key -P "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" "YouTube-${VERSION}.apk" "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}:${{ secrets.SYNOLOGY_PATH }}/"

      - name: Upload version.txt
        if: steps.check.outputs.exists != 'true'
        run: |
          scp -O -i ~/.ssh/synology_key -P "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" version.txt "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}:${{ secrets.SYNOLOGY_PATH }}/"

      - name: Upload SHA256
        if: steps.check.outputs.exists != 'true'
        run: |
          scp -O -i ~/.ssh/synology_key -P "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" sha256.txt "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}:${{ secrets.SYNOLOGY_PATH }}/"

      - name: Verify Synology
        run: |
          VERSION="$(cat version.txt)"
          ssh -i ~/.ssh/synology_key -p "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}" "ls -lh '${{ secrets.SYNOLOGY_PATH }}/YouTube-${VERSION}.apk'"

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/synology_key
          rm -f *.apk
