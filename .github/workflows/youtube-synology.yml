name: Download YouTube APK

on:
  workflow_dispatch:

  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:

  download:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # READ VERSION
      # ==================================================

      - name: Read version.txt
        shell: bash
        run: |
          set -e

          if [ ! -f "version.txt" ]; then
            echo "ERROR: Không tìm thấy version.txt"
            exit 1
          fi

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt rỗng"
            exit 1
          fi

          echo "======================================"
          echo "YouTube VERSION: $VERSION"
          echo "======================================"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"


      # ==================================================
      # SETUP NODE
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==================================================
      # CHECK DOWNLOADER
      # ==================================================

      - name: Check apkmirror.js
        shell: bash
        run: |
          set -e

          if [ ! -f "scripts/apkmirror.js" ]; then
            echo "ERROR: Không tìm thấy scripts/apkmirror.js"
            exit 1
          fi

          echo "Downloader:"
          ls -lh scripts/apkmirror.js


      # ==================================================
      # DOWNLOAD APK
      # ==================================================

      - name: Download YouTube APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOAD YOUTUBE APK"
          echo "VERSION: $VERSION"
          echo "======================================"

          node scripts/apkmirror.js

          APK="com.google.android.youtube-${VERSION}-all.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Không tìm thấy APK:"
            echo "$APK"
            exit 1
          fi

          echo ""
          echo "APK DOWNLOADED:"
          ls -lh "$APK"


      # ==================================================
      # VERIFY APK
      # ==================================================

      - name: Verify APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK không tồn tại"
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 10485760 ]; then
            echo "ERROR: APK nhỏ hơn 10 MB"
            exit 1
          fi

          echo "APK verification OK."


      # ==================================================
      # SHA256
      # ==================================================

      - name: Generate SHA256
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          sha256sum "$APK" > "${APK}.sha256"

          echo "SHA256:"
          cat "${APK}.sha256"


      # ==================================================
      # CREATE RELEASE
      # ==================================================

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"
          SHA="${APK}.sha256"

          TAG="youtube-${VERSION}"
          TITLE="YouTube ${VERSION}"

          echo "======================================"
          echo "CREATE RELEASE"
          echo "TAG: $TAG"
          echo "TITLE: $TITLE"
          echo "======================================"


          # ------------------------------------------------
          # DELETE OLD RELEASE
          # ------------------------------------------------

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release already exists."
            echo "Deleting old release..."

            gh release delete \
              "$TAG" \
              --yes

          fi


          # ------------------------------------------------
          # DELETE OLD TAG IF EXISTS
          # ------------------------------------------------

          if git ls-remote \
            --tags \
            origin \
            "refs/tags/$TAG" |
            grep -q "$TAG"; then

            echo "Deleting old tag..."

            git push \
              origin \
              --delete "$TAG" || true

          fi


          # ------------------------------------------------
          # CREATE RELEASE
          # ------------------------------------------------

          gh release create \
            "$TAG" \
            "$APK" \
            "$SHA" \
            --title "$TITLE" \
            --notes "YouTube ${VERSION} APK"


          echo "======================================"
          echo "RELEASE CREATED"
          echo "======================================"


      # ==================================================
      # SHOW RELEASE
      # ==================================================

      - name: Show Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          TAG="youtube-${VERSION}"

          gh release view "$TAG"


      # ==================================================
      # CLEAN
      # ==================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f \
            youtube_1.tmp \
            youtube_2.tmp \
            youtube_3.tmp \
            youtube_4.tmp

          echo "Cleanup completed."

      # ==================================================
      # Delete excess workflow runs
      # ==================================================

      - name: Delete excess workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Fetching workflow runs..."
          run_ids=$(gh run list --limit 100 --json databaseId -q '.[5:][].databaseId')
          
          for id in $run_ids; do
            echo "Deleting run ID: $id"
            gh run delete "$id" || true
          done
          echo "Cleanup completed!"
