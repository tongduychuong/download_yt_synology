name: Download YouTube APK

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:

  download:

    runs-on: ubuntu-latest

    steps:

      # ================================================
      # CHECKOUT
      # ================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ================================================
      # VERSION
      # ================================================

      - name: Read version
        shell: bash
        run: |

          set -e

          if [ ! -f version.txt ]; then
            echo "ERROR: Không tìm thấy version.txt"
            exit 1
          fi

          VERSION="$(
            tr -d '\r\n' < version.txt |
            xargs
          )"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt rỗng"
            exit 1
          fi

          echo "VERSION=$VERSION"

          echo "VERSION=$VERSION" \
            >> "$GITHUB_ENV"


      # ================================================
      # NODE
      # ================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ================================================
      # PLAYWRIGHT
      # ================================================

      - name: Install Playwright
        shell: bash
        run: |

          set -e

          npm init -y

          npm install playwright

          npx playwright install chromium

          npx playwright install-deps chromium


      # ================================================
      # DOWNLOAD APK
      # ================================================

      - name: Download YouTube APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |

          set -e

          node scripts/apkmirror.js

          APK="com.google.android.youtube-${VERSION}-all.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK không tồn tại"
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"


      # ================================================
      # CHECK APK
      # ================================================

      - name: Verify APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |

          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          SIZE=$(stat -c%s "$APK")

          echo "SIZE: $SIZE"

          if [ "$SIZE" -lt 10485760 ]; then
            echo "ERROR: APK quá nhỏ"
            exit 1
          fi


      # ================================================
      # CREATE RELEASE
      # ================================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        shell: bash
        run: |

          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          TAG="youtube-${VERSION}"

          TITLE="YouTube ${VERSION}"

          echo "TAG:"
          echo "$TAG"

          # Nếu release đã tồn tại thì xóa
          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release already exists."

            gh release delete \
              "$TAG" \
              --yes

          fi

          # Tạo release
          gh release create \
            "$TAG" \
            "$APK" \
            --title "$TITLE" \
            --notes "YouTube ${VERSION} APK"


      # ================================================
      # SHOW RELEASE
      # ================================================

      - name: Show Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        shell: bash
        run: |

          set -e

          TAG="youtube-${VERSION}"

          gh release view "$TAG"
