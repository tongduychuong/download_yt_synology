name: YouTube APKMirror to Synology

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  download-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version.txt: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Find Stable or Beta and download APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/apkmirror.js

      - name: Verify APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FILE="com.google.android.youtube-${VERSION}-all.apk"
          test -f "$FILE"
          SIZE=$(stat -c%s "$FILE")
          echo "Size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "APK is too small"
            exit 1
          fi
          unzip -t "$FILE" >/dev/null

      - name: SHA256 check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum "com.google.android.youtube-${VERSION}-all.apk"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SYNOLOGY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/synology_key
          chmod 600 ~/.ssh/synology_key
          ssh-keyscan -p "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" \
            "${{ secrets.SYNOLOGY_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh -i ~/.ssh/synology_key \
            -p "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" \
            "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}" \
            "echo SSH connection OK"

      - name: Create destination
        run: |
          ssh -i ~/.ssh/synology_key \
            -p "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" \
            "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}" \
            "mkdir -p '${{ secrets.SYNOLOGY_PATH }}'"

      - name: Check existing APK
        id: exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FILE="com.google.android.youtube-${VERSION}-all.apk"
          if ssh -i ~/.ssh/synology_key \
            -p "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" \
            "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}" \
            "test -f '${{ secrets.SYNOLOGY_PATH }}/${FILE}'"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$FILE already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK
        if: steps.exists.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FILE="com.google.android.youtube-${VERSION}-all.apk"
          scp -O \
            -i ~/.ssh/synology_key \
            -P "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" \
            "$FILE" \
            "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}:${{ secrets.SYNOLOGY_PATH }}/"

      - name: Verify remote file
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FILE="com.google.android.youtube-${VERSION}-all.apk"
          ssh -i ~/.ssh/synology_key \
            -p "${{ secrets.SYNOLOGY_SSH_PORT || '22' }}" \
            "${{ secrets.SYNOLOGY_USER }}@${{ secrets.SYNOLOGY_HOST }}" \
            "ls -lh '${{ secrets.SYNOLOGY_PATH }}/${FILE}'"

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/synology_key
          rm -f *.apk
