name: Get Morphe Target YouTube Version Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  get-and-save-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch Latest Morphe CLI and Patches
        run: |
          # 1. Trích xuất URL chính xác bằng jq
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)

          # 2. Kiểm tra nếu không lấy được URL thì dừng lại và báo lỗi rõ ràng
          if [ -z "$CLI_URL" ] || [ "$CLI_URL" == "null" ]; then
            echo "LỖI: Không lấy được URL của morphe-cli! Kiểm tra lại API GitHub hoặc Repo."
            exit 1
          fi

          if [ -z "$PATCHES_URL" ] || [ "$PATCHES_URL" == "null" ]; then
            echo "LỖI: Không lấy được URL của morphe-patches! Kiểm tra lại API GitHub hoặc Repo."
            exit 1
          fi

          echo "Downloading CLI from: $CLI_URL"
          echo "Downloading Patches from: $PATCHES_URL"

          # 3. Tải file về
          curl -sL "$CLI_URL" -o morphe-cli.jar
          curl -sL "$PATCHES_URL" -o morphe-patches.jar

      - name: Extract Target Version and Save to File
        id: extract_version
        run: |
          # Trích xuất phiên bản khuyến nghị cho com.google.android.youtube
          TARGET_VERSION=$(java -jar morphe-cli.jar list-patches -m morphe-patches.jar -a com.google.android.youtube | grep -i "recommended" | awk '{print $NF}' | head -n 1)

          # Dự phòng: Nếu không có chữ "recommended", lấy phiên bản hỗ trợ cao nhất
          if [ -z "$TARGET_VERSION" ]; then
            TARGET_VERSION=$(java -jar morphe-cli.jar list-patches -m morphe-patches.jar -a com.google.android.youtube | grep -E -o "([0-9]+\.[0-9]+\.[0-9]+)" | sort -V | tail -n 1)
          fi

          echo "YouTube Target Version: $TARGET_VERSION"

          # Lưu vào file version_auto.txt
          echo "$TARGET_VERSION" > version_auto.txt
          echo "Lưu thành công vào file version_auto.txt"

      - name: Upload version_auto.txt as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-version-auto
          path: version_auto.txt
