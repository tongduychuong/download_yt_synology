name: Get Supported YouTube Version and Save

on:
  workflow_dispatch: # Cho phép chạy thủ công
  schedule:
    - cron: '0 0 * * *' # Chạy tự động vào 00:00 UTC mỗi ngày

jobs:
  get-and-save-youtube-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest YouTube Version Supported
        id: fetch-version
        run: |
          # 1. Gọi API GitHub chính thức của MorpheApp
          RESPONSE=$(curl -sH "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest")

          # 2. Kiểm tra xem API có trả về JSON hợp lệ không
          if ! echo "$RESPONSE" | jq empty > /dev/null 2>&1; then
            echo "Lỗi: Không thể lấy dữ liệu từ GitHub API!"
            echo "Chi tiết: $RESPONSE"
            exit 1
          fi

          # 3. Trích xuất danh sách phiên bản YouTube từ nội dung Release (Release Notes)
          VERSION=$(echo "$RESPONSE" | jq -r '.body // empty' | grep -oP 'com\.google\.android\.youtube.*?\b\d+\.\d+\.\d+\b' | grep -oP '\d+\.\d+\.\d+' | sort -V | tail -n 1)

          # 4. Nếu không có trong Release Notes, lấy trực tiếp từ file patches.json
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            RAW_JSON=$(curl -sH "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://raw.githubusercontent.com/MorpheApp/morphe-patches/main/patches.json")

            VERSION=$(echo "$RAW_JSON" | jq -r '
              .[]?
              | select(.compatiblePackages != null)
              | .compatiblePackages[]?
              | select(.name == "com.google.android.youtube")
              | .versions[]?
            ' | sort -V | tail -n 1)
          fi

          # 5. Kiểm tra kết quả
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "Không tìm thấy phiên bản YouTube phù hợp trong Morphe Patches!"
            exit 1
          fi

          echo "Tìm thấy YouTube Version: $VERSION"

          # 6. Ghi phiên bản vào file version_auto.txt
          echo "$VERSION" > version_auto.txt
          echo "Đã ghi thành công vào version_auto.txt"

      - name: Commit and Push version_auto.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version_auto.txt
          
          if git diff --staged --quiet; then
            echo "Không có thay đổi về version."
          else
            git commit -m "build: Cập nhật YouTube version tự động ($VERSION) từ MorpheApp"
            git push
          fi
