name: Get Morphe Target YouTube Version Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  get-and-save-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch Latest Morphe CLI and Patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Sử dụng GitHub CLI (gh) có sẵn để tránh lỗi Rate Limit và JSON Null
          echo "Fetching latest release URLs using GitHub CLI..."
          
          # Lấy URL tải morphe-cli
          CLI_URL=$(gh api repos/MorpheApp/morphe-cli/releases/latest --jq '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          
          # Lấy URL tải morphe-patches (hỗ trợ cả .jar và .morphe / .rvp)
          PATCHES_URL=$(gh api repos/MorpheApp/morphe-patches/releases/latest --jq '.assets[] | select(.name | test("\\.(jar|rvp|morphe)$")) | .browser_download_url' | head -n 1)

          if [ -z "$CLI_URL" ]; then
            echo "LỖI: Không thể tìm thấy file .jar của morphe-cli!"
            exit 1
          fi

          if [ -z "$PATCHES_URL" ]; then
            echo "LỖI: Không thể tìm thấy file patches của morphe-patches!"
            exit 1
          fi

          echo "Downloading CLI from: $CLI_URL"
          echo "Downloading Patches from: $PATCHES_URL"

          # 2. Tải file bằng curl kèm token xác thực
          curl -sL -H "Authorization: Bearer $GH_TOKEN" "$CLI_URL" -o morphe-cli.jar
          
          # Đặt tên file patch theo phần mở rộng tương ứng
          PATCH_EXT="${PATCHES_URL##*.}"
          curl -sL -H "Authorization: Bearer $GH_TOKEN" "$PATCHES_URL" -o "morphe-patches.$PATCH_EXT"
          
          echo "PATCH_FILE=morphe-patches.$PATCH_EXT" >> $GITHUB_ENV

      - name: Extract Target Version and Save to File
        id: extract_version
        run: |
          # 3. Trích xuất phiên bản khuyến nghị cho com.google.android.youtube
          TARGET_VERSION=$(java -jar morphe-cli.jar list-patches -m "$PATCH_FILE" -a com.google.android.youtube 2>&1 | grep -i "recommended" | awk '{print $NF}' | head -n 1)

          # Dự phòng: Nếu không tìm thấy nhãn "recommended", trích xuất phiên bản cao nhất
          if [ -z "$TARGET_VERSION" ]; then
            TARGET_VERSION=$(java -jar morphe-cli.jar list-patches -m "$PATCH_FILE" -a com.google.android.youtube 2>&1 | grep -E -o "([0-9]+\.[0-9]+\.[0-9]+)" | sort -V | tail -n 1)
          fi

          if [ -z "$TARGET_VERSION" ]; then
            echo "LỖI: Không đọc được thông tin version từ CLI!"
            exit 1
          fi

          echo "YouTube Target Version: $TARGET_VERSION"

          # Lưu vào file version_auto.txt
          echo "$TARGET_VERSION" > version_auto.txt
          echo "Lưu thành công vào file version_auto.txt"

      - name: Upload version_auto.txt as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-version-auto
          path: version_auto.txt
