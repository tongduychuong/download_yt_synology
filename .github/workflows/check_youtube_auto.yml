name: Get Supported YouTube Version and Save

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  get-and-save-youtube-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest YouTube Version Supported
        id: fetch-version
        run: |
          # 1. Lấy thông tin release mới nhất từ MorpheApp/morphe-patches
          RELEASE_JSON=$(curl -sH "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest")

          # 2. Thử lọc phiên bản YouTube trực tiếp từ nội dung Release Notes (dạng markdown/text)
          VERSION=$(echo "$RELEASE_JSON" | jq -r '.body // empty' | grep -oP 'com\.google\.android\.youtube.*?\b\d+\.\d+\.\d+\b' | grep -oP '\d+\.\d+\.\d+' | sort -V | tail -n 1)

          # 3. Nếu Release Notes không chứa version, tải asset patches.json (hoặc .zip chứa patches.json)
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            # Tìm URL tải file .json hoặc .zip trong phần assets của Release
            ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | test("patches.*\\.(json|zip)$")) | .browser_download_url' | head -n 1)

            if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
              if [[ "$ASSET_URL" == *.zip ]]; then
                curl -sL "$ASSET_URL" -o patches_bundle.zip
                unzip -o patches_bundle.zip -d extracted_patches/
                PATCHES_FILE=$(find extracted_patches -name "patches.json" | head -n 1)
              else
                curl -sL "$ASSET_URL" -o patches.json
                PATCHES_FILE="patches.json"
              fi

              # Parse file patches.json để lấy phiên bản YouTube hỗ trợ cao nhất
              if [ -f "$PATCHES_FILE" ]; then
                VERSION=$(jq -r '
                  .[]? 
                  | select(.compatiblePackages != null) 
                  | .compatiblePackages[]? 
                  | select(.name == "com.google.android.youtube") 
                  | .versions[]?
                ' "$PATCHES_FILE" | sort -V | tail -n 1)
              fi
            fi
          fi

          # 4. Kiểm tra kết quả
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "Lỗi: Không tìm thấy phiên bản YouTube phù hợp!"
            exit 1
          fi

          echo "Phiên bản YouTube hỗ trợ mới nhất: $VERSION"

          # 5. Ghi vào file version_auto.txt
          echo "$VERSION" > version_auto.txt
          echo "Đã ghi $VERSION vào file version_auto.txt"

      - name: Commit and Push version_auto.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version_auto.txt
          
          if git diff --staged --quiet; then
            echo "Không có thay đổi về version."
          else
            git commit -m "build: Cập nhật YouTube version tự động ($VERSION) từ Morphe"
            git push
          fi
