name: Get Supported YouTube Version and Save

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  get-and-save-youtube-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest YouTube Version Supported
        id: fetch-version
        run: |
          # 1. Lấy API release mới nhất từ MorpheApp/morphe-patches
          RELEASE_JSON=$(curl -sH "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest")

          # 2. Lấy link tải của tệp gói patch (.mpp)
          MPP_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | endsWith(".mpp")) | .browser_download_url' | head -n 1)

          if [ -z "$MPP_URL" ] || [ "$MPP_URL" == "null" ]; then
            echo "Lỗi: Không tìm thấy tệp .mpp trong Release mới nhất!"
            exit 1
          fi

          echo "Đang tải tệp patch: $MPP_URL"
          curl -sL "$MPP_URL" -o patch_bundle.zip

          # 3. Giải nén tệp .mpp (bản chất là zip) để lấy patches.json
          unzip -o patch_bundle.zip -d extracted_bundle/
          
          PATCHES_FILE=$(find extracted_bundle -name "patches.json" | head -n 1)

          if [ ! -f "$PATCHES_FILE" ]; then
            echo "Lỗi: Không tìm thấy tệp patches.json bên trong gói patch!"
            exit 1
          fi

          # 4. Trích xuất phiên bản YouTube (com.google.android.youtube) hỗ trợ cao nhất
          VERSION=$(jq -r '
            .[]? 
            | select(.compatiblePackages != null) 
            | .compatiblePackages[]? 
            | select(.name == "com.google.android.youtube") 
            | .versions[]?
          ' "$PATCHES_FILE" | sort -V | tail -n 1)

          # 5. Kiểm tra kết quả thu được
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "Lỗi: Không tìm thấy phiên bản YouTube phù hợp trong patches.json!"
            exit 1
          fi

          echo "Phiên bản YouTube hỗ trợ mới nhất: $VERSION"

          # 6. Ghi vào file version_auto.txt
          echo "$VERSION" > version_auto.txt
          echo "Đã xuất thành công $VERSION vào file version_auto.txt"

      - name: Commit and Push version_auto.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version_auto.txt
          
          if git diff --staged --quiet; then
            echo "Không có thay đổi về version."
          else
            git commit -m "build: Cập nhật YouTube version hỗ trợ ($VERSION) từ Morphe"
            git push
          fi
