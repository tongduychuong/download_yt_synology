name: Get Supported YouTube Version and Save

on:
  workflow_dispatch: # Cho phép chạy thủ công
  schedule:
    - cron: '0 0 * * *' # Chạy tự động vào 00:00 UTC mỗi ngày

jobs:
  get-and-save-youtube-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest YouTube Version Supported
        id: fetch-version
        run: |
          # 1. Tải thông tin release mới nhất từ Morphe Patches
          RESPONSE=$(curl -s https://api.github.com/repos/morphe-modules/morphe-patches/releases/latest)

          # 2. Trích xuất phiên bản YouTube từ release body
          VERSION=$(echo "$RESPONSE" | jq -r '.body' | grep -oP 'com\.google\.android\.youtube.*?\b\d+\.\d+\.\d+\b' | grep -oP '\d+\.\d+\.\d+' | sort -V | tail -n 1)

          # 3. Nếu không tìm thấy trong release body, lấy từ patches.json
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -sL https://raw.githubusercontent.com/morphe-modules/morphe-patches/main/patches.json | jq -r '.[] | select(.compatiblePackages[]?.name == "com.google.android.youtube") | .compatiblePackages[] | select(.name == "com.google.android.youtube") | .versions[]?' | sort -V | tail -n 1)
          fi

          if [ -z "$VERSION" ]; then
            echo "Không tìm thấy phiên bản phù hợp!"
            exit 1
          fi

          echo "Phiên bản YouTube tìm thấy: $VERSION"

          # 4. Xuất phiên bản vào file version_auto.txt
          echo "$VERSION" > version_auto.txt
          echo "Đã ghi vào file version_auto.txt"

      - name: Commit and Push version_auto.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version_auto.txt
          
          # Kiểm tra nếu file có sự thay đổi mới commit
          if git diff --staged --quiet; then
            echo "Không có thay đổi về version, không cần commit."
          else
            git commit -m "build: Cập nhật YouTube version tự động vào version_auto.txt"
            git push
          fi
