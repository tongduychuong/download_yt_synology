name: Get Morphe Target YouTube Version Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  get-and-save-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Fetch Latest Morphe CLI and Patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 1. Tải morphe-cli ==="
          CLI_URL=$(gh api repos/MorpheApp/morphe-cli/releases/latest --jq '.assets[]?.browser_download_url | select(endswith(".jar"))' | head -n 1)
          if [ -z "$CLI_URL" ]; then
            CLI_URL=$(gh api repos/MorpheApp/morphe-cli/releases --jq '.[0].assets[]?.browser_download_url' | grep '\.jar$' | head -n 1)
          fi
          echo "Downloading CLI: $CLI_URL"
          curl -sL -H "Authorization: Bearer $GH_TOKEN" "$CLI_URL" -o morphe-cli.jar

          echo "=== 2. Tải morphe-patches ==="
          PATCHES_URL=$(gh api repos/MorpheApp/morphe-patches/releases/latest --jq '.assets[]?.browser_download_url' | head -n 1)
          
          if [ -n "$PATCHES_URL" ]; then
            PATCH_EXT="${PATCHES_URL##*.}"
            curl -sL -H "Authorization: Bearer $GH_TOKEN" "$PATCHES_URL" -o "morphe-patches.$PATCH_EXT"
            echo "PATCH_FILE=morphe-patches.$PATCH_EXT" >> $GITHUB_ENV
          else
            PKG_URL=$(gh api repos/MorpheApp/morphe-patches/releases --jq '.[0].assets[]?.browser_download_url' | head -n 1)
            curl -sL -H "Authorization: Bearer $GH_TOKEN" "$PKG_URL" -o morphe-patches.jar
            echo "PATCH_FILE=morphe-patches.jar" >> $GITHUB_ENV
          fi

      - name: Extract Target Version and Save to File
        id: extract_version
        run: |
          echo "=== 3. Trích xuất phiên bản YouTube Target ==="
          
          # Sử dụng option --patches theo đúng yêu cầu của Morphe CLI mới
          CLI_OUTPUT=$(java -jar morphe-cli.jar list-patches --patches="$PATCH_FILE" -a com.google.android.youtube 2>&1 || true)
          
          echo "--- Dynamic CLI Output Log ---"
          echo "$CLI_OUTPUT"
          echo "------------------------------"

          # Lấy phiên bản khuyến nghị (Recommended Version)
          TARGET_VERSION=$(echo "$CLI_OUTPUT" | grep -i "recommended" | grep -E -o "([0-9]+\.[0-9]+\.[0-9]+)" | head -n 1)

          # Dự phòng: Lấy phiên bản tương thích cao nhất nếu không gắn nhãn recommended
          if [ -z "$TARGET_VERSION" ]; then
            TARGET_VERSION=$(echo "$CLI_OUTPUT" | grep -E -o "([0-9]+\.[0-9]+\.[0-9]+)" | sort -V | tail -n 1)
          fi

          if [ -z "$TARGET_VERSION" ]; then
            echo "LỖI: Không thể lọc được phiên bản từ Output của CLI!"
            exit 1
          fi

          echo "=========================================="
          echo "SUCCESS: YouTube Target Version = $TARGET_VERSION"
          echo "=========================================="

          # Ghi vào file version_auto.txt
          echo "$TARGET_VERSION" > version_auto.txt
          echo "Đã ghi thành công phiên bản vào file version_auto.txt"

      - name: Upload version_auto.txt as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-version-auto
          path: version_auto.txt
