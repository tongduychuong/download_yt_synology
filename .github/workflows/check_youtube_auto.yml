name: Get Supported YouTube Version and Save

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  get-and-save-youtube-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest YouTube Version Supported
        id: fetch-version
        run: |
          # 1. Tải file patches.json trực tiếp với Header authentication để tránh dính Rate Limit
          RAW_JSON=$(curl -sH "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://raw.githubusercontent.com/morphe-modules/morphe-patches/main/patches.json")

          # 2. Kiểm tra dữ liệu tải về có phải JSON hợp lệ không
          if ! echo "$RAW_JSON" | jq empty > /dev/null 2>&1; then
            echo "Lỗi: Dữ liệu tải về không phải JSON hợp lệ hoặc không tìm thấy repository!"
            echo "Response: $RAW_JSON"
            exit 1
          fi

          # 3. Lọc phiên bản com.google.android.youtube tương thích cao nhất
          VERSION=$(echo "$RAW_JSON" | jq -r '
            .[] 
            | select(.compatiblePackages != null) 
            | .compatiblePackages[] 
            | select(.name == "com.google.android.youtube") 
            | .versions[]?
          ' | sort -V | tail -n 1)

          # 4. Nếu không lọc được từ patches.json, thử đọc từ Release Notes của GitHub API
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            RELEASE_BODY=$(curl -sH "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/morphe-modules/morphe-patches/releases/latest" | jq -r '.body // empty')
            
            VERSION=$(echo "$RELEASE_BODY" | grep -oP 'com\.google\.android\.youtube.*?\b\d+\.\d+\.\d+\b' | grep -oP '\d+\.\d+\.\d+' | sort -V | tail -n 1)
          fi

          # 5. Kiểm tra kết quả cuối cùng
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "Không tìm thấy phiên bản phù hợp!"
            exit 1
          fi

          echo "Tìm thấy YouTube Version: $VERSION"

          # 6. Ghi phiên bản vào file version_auto.txt
          echo "$VERSION" > version_auto.txt
          echo "Đã ghi thành công vào version_auto.txt"

      - name: Commit and Push version_auto.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version_auto.txt
          
          if git diff --staged --quiet; then
            echo "Không có thay đổi về version."
          else
            git commit -m "build: Cập nhật YouTube version tự động ($VERSION) vào version_auto.txt"
            git push
          fi
